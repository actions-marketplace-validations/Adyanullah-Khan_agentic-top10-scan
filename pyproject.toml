[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-top10-scan"
version = "0.1.0"
description = "Static security checks for AI-agent projects, organised by the OWASP Top 10 for Agentic Applications (ASI01-ASI10)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Adyanullah Khan" }]
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]
keywords = ["security", "ai-agents", "llm", "mcp", "owasp", "sarif", "static-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
agentic-top10 = "agentic_top10.cli:main"

[project.urls]
Homepage = "https://github.com/Adyanullah-Khan/agentic-top10-scan"
Issues = "https://github.com/Adyanullah-Khan/agentic-top10-scan/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
